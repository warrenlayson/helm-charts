{{- range $name, $config := .Values.ingressRoute }}
{{- if $config.enabled -}}
{{ $ingressClassAnnotations := dict }}
{{ $ingressClassAnnotations = dict "kubernetes.io/ingress.class" $config.className  }}
{{ $annotations := merge $ingressClassAnnotations (default $config.annotations dict) }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "wg-easy.labels" $ | nindent 4 }}
    {{ with $config.labels }}
    {{- toYaml . | indent 4 }}
    {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- range $config.entryPoints }}
    - {{ . }}
    {{- end }}
  routes:
  - match: {{ $config.matchRule }}
    kind: Rule
    {{- with $config.services }}
    services:
      {{- toYaml . | nindent 6 }}
    {{- end -}}
    {{- with $config.middlewares }}
    middlewares:
      {{- toYaml . | indent 6 }}
    {{- end -}}
  {{- with $config.tls }}
  tls:
    {{- toYaml . | indent 4 }}
  {{- end -}}
{{- end -}}
{{ end }}
