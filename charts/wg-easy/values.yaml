# Default values for wg-easy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # -- wg-easy image host registry
  registry: ghcr.io
  # -- wg-easy image repository
  repository: wg-easy/wg-easy
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
#   fsGroup: 2000
   sysctls:
   - name: net.ipv4.ip_forward
     value: "1"
   - name: net.ipv6.conf.all.disable_ipv6
     value: "0"
   - name: net.ipv6.conf.all.forwarding
     value: "1"
   - name: net.ipv6.conf.default.forwarding
     value: "1"

securityContext:
  privileged: true
  allowPrivilegeEscalation: true
  capabilities:
    add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
  #   drop:
  #    - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

env:
#  https://wg-easy.github.io/wg-easy/v15.1/advanced/config/optional-config/
  PORT: 51821
  HOST: 0.0.0.0
  INSECURE: true
  DISABLE_IPV6: false # Enable this when you have problems with ipv6
#  Learn more about unattended setup: https://wg-easy.github.io/wg-easy/v15.1/advanced/config/unattended-setup/
# If variables are in the same group, you have to set all of them.
#  Group 0
#  INIT_ENABLED: false

#  Group 1
#  INIT_HOST: vpn.example.com # Gr  oup 1
#  INIT_PORT: 51820 # Group 1
#  INIT_USERNAME: admin
#  INIT_PASSWORD: admin

#  Group 2
#  INIT_DNS: 1.1.1.1,8.8.8.8 # Group 2
#  INIT_IPV4_CIDR: 10.8.0.0/24 # Group 2
#  INIT_IPV6_CIDR: # Group 2


secretEnv:
#  Group 1
#  INIT_PASSWORD:
#    secretName: wg-easy-secret
#    secretKey: password
#  INIT_USERNAME:
#    secretName: wg-easy-secret
#    secretKey: username

envFrom: {}
#  - secretRef
#    name: wg-easy-env

ports:
  web:
    port: 51821
    exposedPort: 80
    protocol: TCP
  wg:
    port: 51820
    exposedPort: 51821
    protocol: UDP


# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  type: ClusterIP
  annotations: {}

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# This block is for setting up traefik ingressroute for more information can be found here: https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/crd/http/ingressroute/
ingressRoute:
  dashboard:
    enabled: false
    className: ""
    annotations: {}
    labels: {}
    matchRule: PathPrefix(`/`)
    services:
      - name: wg-easy
        port: 51821
    entryPoints: ["websecure"]
    middlewares: []
    tls: {}

persistence:
  size: 100Mi
  storageClass: ""
  accessModes: ["ReadWriteOnce"]

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes on the output Deployment definition.
additionalVolumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
additionalVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
